pipeline:
  name: model-cd-deploy
  identifier: modelcddeploy
  projectIdentifier: Model_Deployment
  orgIdentifier: default
  tags:
    poc: kserve-cd
  description: Deploy the qwen25-05b-cd InferenceService via Kubernetes Apply. Service On Save OPA checks Git/K8s shape; IaCM plan OPA still owns model allowlist.
  stages:
    - stage:
        name: deploy-model
        identifier: deploymodel
        type: Deployment
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: qwen2505bcd
          environment:
            environmentRef: kservestaging
            deployToAll: false
            infrastructureDefinitions:
              - identifier: kservem0
          execution:
            steps:
              - step:
                  type: HarnessApproval
                  name: approve-cd-apply
                  identifier: approvecdapply
                  timeout: 1d
                  spec:
                    approvalMessage: Review CD apply of qwen25-05b-cd (Service On Save OPA; Git manifest is not evaluated here).
                    includePipelineExecutionHistory: true
                    approvers:
                      userGroups:
                        - _project_all_users
                      minimumCount: 1
                      disallowPipelineExecutor: false
              - step:
                  type: K8sApply
                  name: apply
                  identifier: apply
                  timeout: 15m
                  spec:
                    skipDryRun: false
                    skipSteadyStateCheck: true
                    filePaths:
                      - cd/qwen25-05b/inferenceservice.yaml
              - step:
                  type: ShellScript
                  name: publish-endpoint
                  identifier: publishendpoint
                  timeout: 10m
                  spec:
                    shell: Bash
                    onDelegate: true
                    executionTarget: {}
                    source:
                      type: Inline
                      spec:
                        script: |-
                          endpoint_url="http://qwen25-05b-cd-kserve-m0.<+pipeline.variables.ingress_domain>"
                          export endpoint_url
                          echo "Constructed origin from platform ingress (not probed): ${endpoint_url}"
                    environmentVariables: []
                    outputVariables:
                      - name: endpoint_url
                        type: String
                        value: endpoint_url
          rollbackSteps: []
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
        tags: {}
  variables:
    - name: ingress_domain
      type: String
      description: Public DNS suffix from kserve-platform-demo (typically <lb-ip>.sslip.io). Keep in sync with the platform workspace.
      value: 8.231.51.197.sslip.io
