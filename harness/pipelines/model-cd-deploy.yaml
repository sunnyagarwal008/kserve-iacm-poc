pipeline:
  name: model-cd-deploy
  identifier: modelcddeploy
  projectIdentifier: Model_Deployment
  orgIdentifier: default
  tags:
    poc: kserve-cd
  description: Deploy the qwen25-05b-cd InferenceService via Kubernetes Apply with Custom OPA.
  stages:
    - stage:
        name: deploy-model
        identifier: deploymodel
        type: Deployment
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: qwen2505bcd
          environment:
            environmentRef: kservestaging
            deployToAll: false
            infrastructureDefinitions:
              - identifier: kservem0
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: read-manifest
                  identifier: readmanifest
                  timeout: 5m
                  spec:
                    shell: Bash
                    source:
                      type: Inline
                      spec:
                        script: |
                          set -euo pipefail
                          url = "https://raw.githubusercontent.com/sunnyagarwal008/kserve-iacm-poc/main/cd/qwen25-05b/inferenceservice.yaml"
                          manifest=$(curl --fail --silent --show-error --location "$url")
                          value() {
                            printf '%s\n' "$manifest" | awk -F': ' -v pattern="$1" '$0 ~ pattern {print $2; exit}' | tr -d '"'
                          }
                          MANIFEST_JSON=$(printf \
                            '{"apiVersion":"%s","kind":"%s","metadata":{"name":"%s","namespace":"%s","labels":{"team":"%s","cost_center":"%s"},"annotations":{"kserve.poc/gpu-count":"%s"}},"spec":{"predictor":{"maxReplicas":%s,"model":{"storageUri":"%s"}}}}' \
                            "$(value '^apiVersion:')" \
                            "$(value '^kind:')" \
                            "$(value '^  name:')" \
                            "$(value '^  namespace:')" \
                            "$(value '^    team:')" \
                            "$(value '^    cost_center:')" \
                            "$(value '^    kserve.poc/gpu-count:')" \
                            "$(value '^    maxReplicas:')" \
                            "$(value '^      storageUri:')")
                          export MANIFEST_JSON
                    outputVariables:
                      - name: MANIFEST_JSON
                        type: String
                        value: MANIFEST_JSON
                    onDelegate: true
              - step:
                  type: Policy
                  name: evaluate-serve-opa
                  identifier: evaluateserveopa
                  timeout: 5m
                  spec:
                    policySets:
                      - kserveservemanifest
                    type: Custom
                    policySpec:
                      payload: <+steps.readmanifest.output.outputVariables.MANIFEST_JSON>
              - step:
                  type: HarnessApproval
                  name: approve-cd-apply
                  identifier: approvecdapply
                  timeout: 1d
                  spec:
                    approvalMessage: Review CD OPA result, then apply qwen25-05b-cd.
                    includePipelineExecutionHistory: true
                    approvers:
                      userGroups:
                        - _project_all_users
                      minimumCount: 1
                      disallowPipelineExecutor: false
              - step:
                  type: K8sApply
                  name: apply
                  identifier: apply
                  timeout: 15m
                  spec:
                    skipDryRun: false
                    skipSteadyStateCheck: true
                    filePaths:
                      - inferenceservice.yaml
          rollbackSteps: []
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
        tags: {}
