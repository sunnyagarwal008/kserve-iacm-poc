# QA Kubernetes delegate for GKE iac-play/us-west1/iac-team-standard.
# Secret kserve-m0-delegate-account-token (key DELEGATE_TOKEN) is created out of band; do not commit it.
apiVersion: v1
kind: Namespace
metadata:
  name: kserve-m0
  labels:
    app: kserve-m0
    team: sunny
    poc: kserve-iacm
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kserve-m0-cluster-admin
  labels:
    app: kserve-m0
    team: sunny
subjects:
  - kind: ServiceAccount
    name: default
    namespace: kserve-m0
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kserve-m0-delegate
  namespace: kserve-m0
  labels:
    app: kserve-m0
    team: sunny
    harness.io/name: kserve-m0-delegate
spec:
  replicas: 1
  selector:
    matchLabels:
      harness.io/name: kserve-m0-delegate
  template:
    metadata:
      labels:
        app: kserve-m0
        team: sunny
        harness.io/name: kserve-m0-delegate
      annotations:
        prometheus.io/path: /api/metrics
        prometheus.io/port: "3460"
        prometheus.io/scrape: "true"
    spec:
      terminationGracePeriodSeconds: 600
      containers:
        - name: delegate
          image: us-docker.pkg.dev/gar-prod-setup/harness-public/harness/delegate:26.05.89205
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "500m"
              memory: 2Gi
            limits:
              cpu: "1"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3460
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/health
              port: 3460
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 18
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 0
          envFrom:
            - secretRef:
                name: kserve-m0-delegate-account-token
          env:
            - name: JAVA_OPTS
              value: -Xms64M
            - name: ACCOUNT_ID
              value: 25NKDX79QPC-YTyninmxRQ
            - name: MANAGER_HOST_AND_PORT
              value: https://qa.harness.io
            - name: DEPLOY_MODE
              value: KUBERNETES
            - name: DELEGATE_NAME
              value: kserve-m0-delegate
            - name: DELEGATE_TYPE
              value: KUBERNETES
            - name: DELEGATE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: INIT_SCRIPT
              value: ""
            - name: DELEGATE_DESCRIPTION
              value: KServe M0 POC on iac-team-standard
            - name: DELEGATE_TAGS
              value: kserve-m0
            - name: NEXT_GEN
              value: "true"
            - name: CLIENT_TOOLS_DOWNLOAD_DISABLED
              value: "true"
            - name: DYNAMIC_REQUEST_HANDLING
              value: "false"
